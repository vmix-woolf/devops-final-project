{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.existingSecret }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "secret.DJANGO_SECRET_KEY is required" .Values.secret.DJANGO_SECRET_KEY | quote }}
  POSTGRES_PASSWORD: {{ required "secret.POSTGRES_PASSWORD is required" .Values.secret.POSTGRES_PASSWORD | quote }}
{{- end }}
