controller:
  admin:
    existingSecret: ${admin_secret_name}
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  serviceType: ${service_type}

  additionalExistingSecrets:
    - name: ${github_secret_name}
      keyName: private-key

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - github
    - job-dsl
    - configuration-as-code
    - credentials
    - plain-credentials
    - ssh-credentials
    - ssh-agent
    - pipeline-utility-steps

  JCasC:
    defaultConfig: true

    configScripts:
      github-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - basicSSHUserPrivateKey:
                      scope: GLOBAL
                      id: "github-rsa-key"
                      username: "git"
                      description: "GitHub SSH key for final-project"
                      privateKeySource:
                        directEntry:
                          privateKey: $${${github_secret_name}-private-key}

      django-pipeline-job: |
        jobs:
          - script: >
              pipelineJob('django-app') {
                description('Build Django image, push it to ECR and update the Helm image tag.')

                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('git@github.com:vmix-woolf/devops-final-project.git')
                          credentials('github-rsa-key')
                        }

                        branch('*/final-project')
                      }
                    }

                    scriptPath('Jenkinsfile')
                    lightweight(true)
                  }
                }

                triggers {
                  githubPush()
                }
              }

      kubernetes-agents: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                namespace: "jenkins"
                serverUrl: "https://kubernetes.default"
                jenkinsUrl: "${jenkins_url}"

                templates:
                  - name: "kaniko-git"
                    label: "kaniko-git"
                    namespace: "jenkins"
                    serviceAccount: "jenkins"

                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        alwaysPullImage: true
                        args: "$${computer.jnlpmac} $${computer.name}"

                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:debug"
                        command: "/busybox/cat"
                        ttyEnabled: true
                        alwaysPullImage: true

                        envVars:
                          - envVar:
                              key: "AWS_REGION"
                              value: "${aws_region}"

                          - envVar:
                              key: "AWS_DEFAULT_REGION"
                              value: "${aws_region}"

                          - envVar:
                              key: "AWS_SDK_LOAD_CONFIG"
                              value: "true"

                          - envVar:
                              key: "ECR_REPOSITORY"
                              value: "${ecr_repository}"

                      - name: "git"
                        image: "alpine/git:latest"
                        command: "sleep"
                        args: "9999999"
                        ttyEnabled: true
                        alwaysPullImage: true

                    volumes:
                      - emptyDirVolume:
                          memory: false
                          mountPath: "/workspace"

persistence:
  enabled: true
  storageClass: ${storage_class}
  size: ${storage_size}

agent:
  enabled: true

rbac:
  create: true

serviceAccount:
  create: true
  name: jenkins

  annotations:
    eks.amazonaws.com/role-arn: ${service_account_role_arn}
